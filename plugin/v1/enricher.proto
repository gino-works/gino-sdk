syntax = "proto3";

package plugin.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/gino-works/gino-sdk/plugin/v1;ginopluginv1";

service EnricherService {
  rpc Enrich(EnrichRequest) returns (EnrichResponse);
}

// EnrichTask is the transformed payload of one task of one input.
message EnrichTask {
  // the input (ModelInput.name) the task belongs to.
  string input = 1;
  // the task's name (CliCommand/HTTPRequest/TCPProbe.name).
  string task = 2;
  bytes payload = 3;
  google.protobuf.Timestamp collected_at = 4;
}

message EnrichRequest {
  bytes endpoint = 1;
  string model = 2;
  string version = 3;
  // every task of every input of the model version, ordered: inputs in the model version's input
  // order, and within an input its tasks in the platform's order. tasks of one input are
  // contiguous.
  repeated EnrichTask tasks = 4;
}

message EnrichResponse {
  bytes data = 1;
}
