syntax = "proto3";

package plugin.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/gino-works/gino-sdk/plugin/v1;ginopluginv1";

// Input is one part (task) of one input to collect, as the Platform defined it for this kind.
message Input {
  // the logical, model facing input (ModelInput.name) the task belongs to.
  string name = 1;
  // the actual task to execute -- the CliCommand/HTTPRequest/TCPProbe as json.
  bytes impl = 2;
  // the task: the CliCommand/HTTPRequest/TCPProbe name impl holds. Informational -- impl already
  // is that one part -- for logging and for plugins that key anything per task.
  string task = 3;
}

service CollectorService {
  // Open establishes the session for an endpoint. gino calls it before the first Collect for an
  // endpoint and again after a Collect returns UNAVAILABLE. Credentials are passed whole; the
  // plugin touches no mount.
  rpc Open(OpenRequest) returns (OpenResponse);
  // Collect runs one task of an input on an open session and returns every payload it produced:
  // one, or for fan-out collectors one per endpoint. gino calls it once per task, in the
  // platform's order, so a failure on one task loses only that task's payload.
  rpc Collect(CollectRequest) returns (CollectResponse);
  // Close tears a session down: the endpoint left the assignment, or gino is shutting down.
  // Best effort; gino does not wait long.
  rpc Close(CloseRequest) returns (CloseResponse);
}

message OpenResponse {}

message OpenRequest {
  // apis/v1 WorkerAssignmentEndpoint as JSON: identity, resolved metadata, host, platform name.
  bytes endpoint = 1;
  // the credential Secret's keys as the worker mounted them: username, password, privateKey,
  // token, ca.crt, tls.crt, tls.key, plugins job to know what it cares about.
  map<string, bytes> credentials = 2;
}

message CollectRequest {
  // the session; the same bytes as Open. The plugin keys sessions by namespace/name.
  bytes endpoint = 1;
  Input input = 2;
}

// Collected is one payload out of a task. Its associated upstream by endpoint/input/task -- w/ the
// exception for fan-out things (collector collects one "thing" then dispatches it for N endpoints
// -- best example is collecting from for ex vmanage, fanning out for each individual vedge).
message Collected {
  bytes payload = 1;
  // when the data is from, if the plugin knows better than gino (a device timestamp). Unset
  // means the time gino handed out the batch.
  google.protobuf.Timestamp collected_at = 2;
  // set when the task failed on a session that is otherwise fine (the device rejected the
  // command, for example). gino does not publish it and logs error; the input's other tasks
  // still publish and the input simply stays incomplete until the next cycle.
  string error = 3;
  // for fan-out collectors (one session, payloads for many endpoints) the implementation can
  // fill this in (its just the WorkerAssignmentEndpoint json) -- if its set the gino side
  // publishes with this endpoint data in the outgoing message.
  bytes endpoint = 4;
}

message CollectResponse {
  // payloads for the requested task; normally exactly one, more only for fan-out collectors (each
  // with endpoint set), none if the task produced nothing.
  repeated Collected collected = 1;
}

message CloseRequest {
  bytes endpoint = 1;
}

message CloseResponse {}
