syntax = "proto3";

package plugin.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/gino-works/gino-sdk/plugin/v1;ginopluginv1";

service LoaderService {
  rpc Load(LoadRequest) returns (LoadResponse);
}

message LoadInputSource {
  string name = 1;
  google.protobuf.Timestamp collected_at = 2;
}

message LoadInput {
  bytes endpoint = 1;
  bytes payload = 2;
  google.protobuf.Timestamp enriched_at = 3;
  repeated LoadInputSource inputs = 4;
}

message LoadRequest {
  string model = 1;
  string version = 2;
  repeated LoadInput inputs = 3;
}

message LoadResponse {}
