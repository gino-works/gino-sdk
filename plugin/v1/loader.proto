syntax = "proto3";

package plugin.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/gino-works/gino-sdk/plugin/v1;ginopluginv1";

service LoaderService {
  rpc Load(LoadRequest) returns (LoadResponse);
}

// LoadSource is provenance: one task whose payload went into the enriched model.
message LoadSource {
  // the input (ModelInput.name) the task belongs to.
  string model_input = 1;
  // the task's name (CliCommand/HTTPRequest/TCPProbe.name).
  string task = 2;
  google.protobuf.Timestamp collected_at = 3;
}

message LoadInput {
  bytes endpoint = 1;
  bytes payload = 2;
  google.protobuf.Timestamp enriched_at = 3;
  repeated LoadSource sources = 4;
}

message LoadRequest {
  string model = 1;
  string version = 2;
  repeated LoadInput inputs = 3;
}

message LoadResponse {}
